
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/html5-qrcode"></script>
<script>
  // ========== 裝置檢測與版本選擇 ==========
  (function() {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    window.isAndroid = /Android/i.test(ua);

    console.log('裝置檢測:');
    console.log('  User Agent:', ua);
    console.log('  是否為 Android:', window.isAndroid);
    console.log('  最終使用版本:', window.isAndroid ? 'Android 版本' : 'iPhone 版本');
  })();
</script>

<style>
  /* ========== iPhone 版本樣式（保持原樣） ========== */
  .iphone-version {
    display: block;
  }

  body.iphone {
    font-family: -apple-system, "Microsoft JhengHei", sans-serif;
    text-align: center;
    background: #1a1a1a;
    margin: 0;
    padding: 10px;
    color: white;
  }

  .iphone-version #main h1 {
    margin-bottom: 45px;
  }

  .iphone-version #reader {
    width: 295px;
    max-width: 100%;
    height: 295px;
    margin: 10px auto;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #3498db;
    background: #000;
    padding-bottom: env(safe-area-inset-bottom, 10px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .iphone-version #reader > div:first-child {
    width: 100% !important;
    height: 100% !important;
    min-height: 100% !important;
    max-height: 100% !important;
  }

  .iphone-version #reader video,
  .iphone-version #reader canvas {
    width: 100% !important;
    height: 100% !important;
    object-fit: cover !important;
    border-radius: 20px;
  }

  .iphone-version #result,
  .iphone-version #setup-result {
    font-size: 1.85rem;
    margin: 15px auto;
    padding: 15px 20px;
    width: 90%;
    max-width: 550px;
    border-radius: 15px;
    min-height: 60px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .iphone-version #setup-status {
    margin-top: 15px;
    color: #95a5a6;
    font-size: 1.1rem;
  }

  .iphone-version .setup-line {
    width: 95%;
    max-width: 600px;
    height: 3px;
    background: #3498db;
    margin: 15px auto;
    border: none;
  }

  .iphone-version .success { background: #2ecc71; color: white; }
  .iphone-version .repeat { background: #f1c40f; color: #333; }
  .iphone-version .error { background: #e74c3c; color: white; }

  .iphone-version .init-btn {
    padding: 20px 60px;
    font-size: 1.8rem;
    background: linear-gradient(135deg, #3498db 0%, #2ecc71 100%);
    color: white;
    border: none;
    border-radius: 50px;
    margin-top: 20px;
    margin-bottom: 20px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 10px 20px rgba(52, 152, 219, 0.4);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    touch-action: manipulation;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }

  .iphone-version .tip {
    color: #f08080;
    margin-top: 10px;
    font-size: 1.2rem;
  }

  /* ========== 密碼輸入與確認按鈕同一列 ========== */
  .password-confirm-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
    width: 90%;
    max-width: 400px;
    margin: 0 auto;
    box-sizing: border-box;
  }

  .password-confirm-row input {
    flex: 1;
    min-width: 0;
    width: auto !important;
  }

  .password-confirm-button {
    flex-shrink: 0;
    padding: 0 16px;
    font-size: 1rem;
    font-weight: bold;
    color: white;
    background: #3498db;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
    touch-action: manipulation;
  }

  /* ========== Android 版本樣式 ========== */
  .android-version {
    display: none;
  }

  body.android {
    font-family: sans-serif;
    text-align: center;
    background: #1a1a1a;
    margin: 0;
    padding: 20px;
    color: white;
  }

  .android-version #android-reader {
    width: 300px;
    max-width: 100%;
    height: 300px;
    margin: 10px auto;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #3498db;
    background: #000;
  }

  .android-version .android-setup-line {
    width: 95%;
    max-width: 600px;
    height: 3px;
    background: #3498db;
    margin: 15px auto;
    border: none;
  }

  .android-version #android-result {
    font-size: 1.85rem;
    margin: 15px -10px;
    padding: 20px 10px;
    width: calc(100%+20px)%;
    box-sizing: border-box;
    border-radius: 15px;
    min-height: 85px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  .android-version .success { background: #2ecc71; color: white; }
  .android-version .repeat { background: #f1c40f; color: #333; }
  .android-version .error { background: #e74c3c; color: white; }
  .android-version .info { background: #3498db; color: white; }

  .android-version .action-button {
    padding: 20px 40px;
    font-size: 1.5rem;
    margin: 20px 10px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    min-width: 220px;
  }

  .android-version #startBtn {
    background: #2ecc71;
    color: white;
  }

  .android-version #nextBtn {
    background: #9b59b6;
    color: white;
    display: none;
  }

  .android-version #status {
    margin-top: 15px;
    color: #95a5a6;
    font-size: 1.1rem;
    display: none !important;
  }
</style>
</head>

<body>

<div id="iphone-container" class="iphone-version">
  <div id="setup">
    <h1>iPhone手機掃描作業</h1>

    <div id="setup-status">請輸入工作人員密碼後開始掃描</div>

    <hr class="setup-line">

    <!-- iPhone 工作人員密碼 -->
    <div class="password-confirm-row">
      <input
        id="iphone-staff-password"
        type="password"
        placeholder="請輸入工作人員密碼"
        autocomplete="current-password"
        style="box-sizing:border-box; padding:15px; font-size:1.2rem; border-radius:10px; border:2px solid #3498db; text-align:center;"
      >

      <button
        class="password-confirm-button"
        onclick="verifyIPhonePassword()"
      >確認</button>
    </div>

    <div id="iphone-password-error"
      style="color:#ff6b6b; margin-top:10px; min-height:24px;">
    </div>

    <div id="setup-result">準備就緒</div>

    <p></p>
    <p></p>
    <p class="tip">點擊後將啟動相機與語音通知</p>
  </div>

  <div id="main" style="display:none;">
    <h1>iPhone手機掃描作業</h1>

    <div id="iphone-scan-stats"
      style="display:none; font-size:18px; color:#F3E6C8; width:95%; box-sizing:border-box; margin:-30px auto 14px; justify-content:center; align-items:center;">
      <span>報到成功：<span id="iphone-checkin-count">0</span></span>
      　　<span>投票成功：<span id="iphone-vote-count">0</span></span>
    </div>

    <div id="reader"></div>
    <div id="result">掃描QR-Code</div>
  </div>
</div>

<div id="android-container" class="android-version">
  <h1>安卓手機掃描作業</h1>

  <div id="android-scan-stats"
    style="display:none; font-size:18px; color:#F3E6C8; width:95%; box-sizing:border-box; margin:5px auto 14px; justify-content:center; align-items:center;">
    <span>報到成功：<span id="android-checkin-count">0</span></span>
    　　<span>投票成功：<span id="android-vote-count">0</span></span>
  </div>

  <div id="status">請點擊「開始掃描」按鈕</div>

  <div id="staff-login" style="margin:20px auto; max-width:400px;">

    <div class="password-confirm-row">
      <input
        id="staff-password"
        type="password"
        placeholder="請輸入工作人員密碼"
        autocomplete="current-password"
        style="box-sizing:border-box; padding:15px; font-size:1.2rem; border-radius:10px; border:2px solid #3498db; text-align:center;"
      >

      <button
        id="startBtn"
        class="password-confirm-button"
      >確認</button>
    </div>

    <div id="staff-password-error"
      style="color:#ff6b6b; margin-top:10px; min-height:24px;">
    </div>
  </div>

  <hr class="android-setup-line">
  <div id="android-reader" style="display:none;"></div>
  <div id="android-result">準備就緒</div>

  <div>
    <button id="nextBtn" class="action-button">✅  繼續掃描 ...</button>
    <p></p>
    <p></p>
    <p class="tip" id="android-tip">點擊後將啟動相機與語音通知</p>
  </div>
</div>

<script>
  // ========== 從 Index 傳入的啟動設定 ==========
  const scannerParams = new URLSearchParams(window.location.search);

  const API_TOKEN = scannerParams.get('token') || '';
  const GAS_EXEC_URL = scannerParams.get('url') || '';

  console.log('Scanner 啟動設定:');
  console.log('  GAS URL 是否取得:', !!GAS_EXEC_URL);
  console.log('  TOKEN 是否取得:', !!API_TOKEN);

  // ========== 共用直接 POST 通訊 ==========

  // 工作人員密碼只保留在目前頁面的記憶體
  let staffPassword = '';

  let scannerRequestSequence = 0;
  const scannerPendingRequests = new Map();

  // 直接向 GAS Web App 發送 POST
  function sendGasRequest(action, payload, successCallback, failureCallback) {
    scannerRequestSequence++;

    const requestId = 'scanner-' + Date.now() + '-' + scannerRequestSequence;
    const controller = new AbortController();

    scannerPendingRequests.set(requestId, {
      controller: controller
    });

    const requestPayload = Object.assign({}, payload || {}, {
      action: action,
      password: staffPassword,
      token: API_TOKEN,
      requestId: requestId
    });

    // iPhone 原本使用 codeText，轉成後端要求的 code
    if (action === 'PROCESS_CHECKIN') {
      requestPayload.code = String(
        requestPayload.codeText || requestPayload.code || ''
      ).trim();

      delete requestPayload.codeText;
    }

    fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(requestPayload),
      redirect: 'follow',
      signal: controller.signal
    })
    .then(response => {
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      return response.json();
    })
    .then(data => {
      if (!scannerPendingRequests.has(requestId)) return;

      if (!data || data.status !== 'ok') {
        scannerPendingRequests.delete(requestId);

        if (failureCallback) {
          failureCallback(new Error(
            data && data.msg ? String(data.msg) : '後端驗證失敗'
          ));
        }
        return;
      }

      scannerPendingRequests.delete(requestId);

      if (successCallback) {
        successCallback(data.result);
      }
    })
    .catch(error => {
      if (!scannerPendingRequests.has(requestId)) return;

      scannerPendingRequests.delete(requestId);

      if (failureCallback) {
        failureCallback(error);
      }
    });

    return requestId;
  }

  // 取消已逾時或不再需要的請求
  function cancelGasRequest(requestId) {
    if (!requestId) return;

    const pending = scannerPendingRequests.get(requestId);

    if (pending) {
      scannerPendingRequests.delete(requestId);
      pending.controller.abort();
    }
  }

  // ========== 報到及投票結束狀態 ==========
  let CHECK_IN_END = 'NO';
  let VOTE_END = 'NO';
  let scanStatusPollingTimer = null;

  // 向 GAS 後端取得最新狀態
  function refreshScanEndStatus() {
    let statusRequestId = null;
    let statusTimeout = null;

    statusRequestId = sendGasRequest(
      'GET_STATUS',
      {},
      function(res) {
        if (statusTimeout !== null) {
          clearTimeout(statusTimeout);
        }

        if (res) {
          CHECK_IN_END = String(res.CHECK_IN_END || 'NO').trim().toUpperCase();
          VOTE_END = String(res.VOTE_END || 'NO').trim().toUpperCase();

          console.log('報到結束狀態:', CHECK_IN_END);
          console.log('投票結束狀態:', VOTE_END);
        } else {
          console.log('取得報到及投票狀態失敗：後端沒有回傳資料');
        }
      },
      function(err) {
        if (statusTimeout !== null) {
          clearTimeout(statusTimeout);
        }

        console.log('取得報到及投票狀態失敗：', err);
      }
    );

    if (statusRequestId !== null) {
      statusTimeout = setTimeout(function() {
        cancelGasRequest(statusRequestId);
        console.log('取得報到及投票狀態逾時');
      }, 5000);
    }
  }

  // 掃描器啟動時取得狀態，之後每 60 秒更新
  function startScanStatusPolling() {
    refreshScanEndStatus();

    if (scanStatusPollingTimer !== null) {
      clearInterval(scanStatusPollingTimer);
    }

    scanStatusPollingTimer = setInterval(refreshScanEndStatus, 60000);
  }

  // 判斷 QR Code 屬於報到或投票，並檢查是否已結束
  function checkScanEndStatus(codeText) {
    var normalizedCode = String(codeText || '').trim();
    var isVote = /Q\d{2}[YN]$/i.test(normalizedCode);

    console.log('掃描結束狀態判斷:', {
      QRCode: normalizedCode,
      是否投票: isVote,
      CHECK_IN_END: CHECK_IN_END,
      VOTE_END: VOTE_END
    });

    if (isVote && VOTE_END === 'YES') {
      return '投票已結束';
    }

    if (!isVote && CHECK_IN_END === 'YES') {
      return '報到已結束';
    }

    return '';
  }

  // ========== iPhone 版本 JavaScript ==========
  let html5QrCode;
  let isProcessing = false;

  let iphoneCheckInCount = 0;
  let iphoneVoteCount = 0;
  let iphoneTimedOutCode = null;

  function speak(text) {
    window.speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'zh-TW';
    window.speechSynthesis.speak(msg);
  }

  // iPhone 工作人員密碼確認
  function verifyIPhonePassword() {
    const passwordInput = document.getElementById('iphone-staff-password');
    const passwordError = document.getElementById('iphone-password-error');
    const enteredPassword = String(passwordInput.value || '');

    if (!enteredPassword) {
      passwordError.innerText = '請先輸入工作人員密碼';
      passwordInput.focus();
      return;
    }

    staffPassword = enteredPassword;
    passwordError.innerText = '正在確認密碼...';

    sendGasRequest(
      'GET_STATUS',
      {},
      function(res) {
        passwordError.innerText = '';
        initIPhoneSystem();
      },
      function(error) {
        staffPassword = '';
        passwordInput.value = '';
        passwordError.innerText = '工作人員密碼錯誤，請重新輸入';
        document.getElementById('setup-result').innerText = '工作人員密碼錯誤';

        console.log('iPhone 密碼確認失敗:', error);
      }
    );
  }

  // iPhone 工作人員密碼錯誤時，返回初始畫面
  function returnIPhoneToSetup(errorMessage) {
    staffPassword = '';

    document.getElementById('iphone-staff-password').value = '';
    document.getElementById('iphone-password-error').innerText =
      errorMessage || '工作人員密碼錯誤，請重新輸入';

    document.getElementById('setup-status').innerText =
      '請重新輸入工作人員密碼';

    document.getElementById('setup-result').innerText =
      '工作人員密碼錯誤';

    document.getElementById('setup').style.display = 'block';
    document.getElementById('main').style.display = 'none';

    isProcessing = false;

    if (html5QrCode) {
      html5QrCode.stop().then(function() {
        html5QrCode.clear();
        html5QrCode = null;
      }).catch(function(error) {
        console.warn('停止 iPhone 掃描器時發生錯誤:', error);
        html5QrCode = null;
      });
    }

    speak('工作人員密碼錯誤，請重新輸入');
  }

  function initIPhoneSystem() {
    // 密碼已經確認成功，現在才開始輪詢
    startScanStatusPolling();

    iphoneCheckInCount = 0;
    iphoneVoteCount = 0;
    iphoneTimedOutCode = null;

    document.getElementById('iphone-checkin-count').innerText = '0';
    document.getElementById('iphone-vote-count').innerText = '0';
    document.getElementById('iphone-scan-stats').style.display = 'flex';

    speak("掃描系統啟動");

    document.getElementById('setup').style.display = 'none';
    document.getElementById('main').style.display = 'block';

    html5QrCode = new Html5Qrcode("reader", {
      formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ]
    });

    const config = {
      fps: 20,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
        let boxSize = Math.floor(minEdge * 0.7);
        return { width: boxSize, height: boxSize };
      },
      aspectRatio: 1.0
    };

    html5QrCode.start(
      { facingMode: "environment" },
      config,
      onScan
    ).catch(err => {
      alert("相機啟動失敗，請確認已授權權限並使用 Chrome/Safari 瀏覽器。");
      console.error(err);
    });
  }

  function onScan(text) {
    if (isProcessing) {
      console.log('已有掃描處理中，忽略新的掃描');
      return;
    }

    isProcessing = true;

    const normalizedCode = String(text || '').trim();
    const matchedTimedOutCode = iphoneTimedOutCode !== null &&
      iphoneTimedOutCode === normalizedCode;

    iphoneTimedOutCode = null;

    html5QrCode.pause();

    const resDiv = document.getElementById('result');
    resDiv.className = "";
    resDiv.innerText = "驗證中...";

    const endMessage = checkScanEndStatus(text);

    if (endMessage) {
      resDiv.className = "error";
      resDiv.innerText = endMessage;
      speak(endMessage);

      setTimeout(() => {
        resDiv.className = "";
        resDiv.innerText = "掃描QR-Code";

        html5QrCode.resume();

        setTimeout(() => {
          isProcessing = false;
        }, 700);

      }, 1000);

      return;
    }

    let requestFinished = false;
    let checkinRequestId = null;

    const requestTimeout = setTimeout(() => {
      if (requestFinished) return;
      requestFinished = true;

      cancelGasRequest(checkinRequestId);

      iphoneTimedOutCode = normalizedCode;

      resDiv.className = "error";
      resDiv.innerText = "驗證逾時請重新掃描";
      speak("驗證逾時請重新掃描");

      setTimeout(() => {
        resDiv.className = "";
        resDiv.innerText = "掃描QR-Code";
        html5QrCode.resume();

        setTimeout(() => {
          isProcessing = false;
        }, 700);
      }, 1000);

    }, 10000);

    checkinRequestId = sendGasRequest(
      'PROCESS_CHECKIN',
      { codeText: text },
      (res) => {
        if (requestFinished) return;

        requestFinished = true;
        clearTimeout(requestTimeout);

        const isVoteCode = /Q\d{2}[YN]$/i.test(String(text || '').trim());

        if (isVoteCode) {
          if (res && /重新掃描/.test(String(res.msg || ''))) {
            iphoneVoteCount = Math.max(0, iphoneVoteCount - 1);
          } else if (res && res.status === 'success') {
            iphoneVoteCount++;
          } else if (matchedTimedOutCode && res && res.status === 'repeat' &&
                     /已投票/.test(String(res.msg || ''))) {
            iphoneVoteCount++;
          }

          document.getElementById('iphone-vote-count').innerText = iphoneVoteCount;

        } else if (res && res.status === 'success') {
          iphoneCheckInCount++;
          document.getElementById('iphone-checkin-count').innerText = iphoneCheckInCount;

        } else if (matchedTimedOutCode && res && res.status === 'repeat' &&
                   /已完成報到/.test(String(res.msg || ''))) {
          iphoneCheckInCount++;
          document.getElementById('iphone-checkin-count').innerText = iphoneCheckInCount;
        }

        resDiv.className = res.status;
        resDiv.innerText = (res.info || "") + " " + res.msg;
        speak(res.msg);

        setTimeout(() => {
          resDiv.className = "";
          resDiv.innerText = "掃描QR-Code";

          html5QrCode.resume();

          setTimeout(() => {
            isProcessing = false;
          }, 700);

        }, 1000);
      },
      (error) => {
        if (requestFinished) return;

        requestFinished = true;
        clearTimeout(requestTimeout);

        // 工作人員密碼錯誤：返回密碼輸入畫面
        if (String(error).indexOf('工作人員密碼錯誤') !== -1) {
          returnIPhoneToSetup('工作人員密碼錯誤，請重新輸入');
          return;
        }

        resDiv.className = "error";
        resDiv.innerText = "連線錯誤，請重試";
        speak("錯誤");

        setTimeout(() => {
          resDiv.className = "";
          resDiv.innerText = "掃描QR-Code";
          html5QrCode.resume();

          setTimeout(() => {
            isProcessing = false;
          }, 500);

        }, 1000);
      }
    );
  }

  // ========== Android 版本 JavaScript ==========
  if (window.isAndroid) {
    let androidHtml5QrCode = null;
    let isAndroidProcessing = false;

    const resultDiv = document.getElementById('android-result');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const nextBtn = document.getElementById('nextBtn');

    let androidCheckInCount = 0;
    let androidVoteCount = 0;
    let androidTimedOutCode = null;

    let androidScanSessionReady = false;
    let androidRecoveryInProgress = false;

    function clearResultStyles() {
      resultDiv.className = '';
      resultDiv.style.backgroundColor = '';
      resultDiv.style.color = '';
    }

    window.addEventListener('load', function() {
      statusDiv.textContent = '請輸入工作人員密碼後開始掃描';

      startBtn.onclick = function() {
        const passwordInput = document.getElementById('staff-password');
        const passwordError = document.getElementById('staff-password-error');
        const enteredPassword = String(passwordInput.value || '');

        if (!enteredPassword) {
          passwordError.textContent = '請先輸入工作人員密碼';
          passwordInput.focus();
          return;
        }

        staffPassword = enteredPassword;
        passwordError.textContent = '正在確認密碼...';

        sendGasRequest(
          'GET_STATUS',
          {},
          function(res) {
            passwordError.textContent = '';

            // 密碼驗證成功後才啟動輪詢
            startScanStatusPolling();

            if ('speechSynthesis' in window) {
              speakWithFallback('啟動相機');
            }

            document.getElementById('staff-login').style.display = 'none';

            clearResultStyles();
            resultDiv.textContent = '正在啟動相機...';

            startNewScanSession();
          },
          function(error) {
            staffPassword = '';
            passwordInput.value = '';

            if (String(error).indexOf('工作人員密碼錯誤') !== -1) {
              passwordError.textContent =
                '工作人員密碼錯誤，請重新輸入';
            } else {
              passwordError.textContent =
                '連線錯誤，請確認網路後重新確認';
            }

            console.log('Android 密碼確認失敗:', error);
          }
        );
      };
    });

    async function startNewScanSession(isRecovery = false) {
      document.getElementById('android-reader').style.display = 'block';
      document.querySelector('.android-setup-line').style.display = 'none';
      document.getElementById('android-tip').style.display = 'none';

      if (!isRecovery) {
        androidCheckInCount = 0;
        androidVoteCount = 0;
        androidTimedOutCode = null;

        document.getElementById('android-checkin-count').innerText = '0';
        document.getElementById('android-vote-count').innerText = '0';
      }

      document.getElementById('android-scan-stats').style.display = 'flex';
      statusDiv.style.display = 'block';

      androidScanSessionReady = false;
      isAndroidProcessing = false;

      startBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      statusDiv.textContent = '正在初始化...';

      if (androidHtml5QrCode) {
        try {
          await androidHtml5QrCode.stop();
          androidHtml5QrCode.clear();
        } catch(e) {
          console.warn('清理舊實例時發生錯誤:', e);
        }

        androidHtml5QrCode = null;
      }

      androidHtml5QrCode = new Html5Qrcode("android-reader");

      const config = {
        fps: 2,
        qrbox: { width: 180, height: 180 },
        aspectRatio: 1.0,
        disableFlip: false
      };

      const onScanSuccess = (decodedText) => {
        if (isAndroidProcessing) {
          console.log('已有掃描處理中，忽略新的掃描');
          return;
        }

        isAndroidProcessing = true;

        const normalizedCode = String(decodedText || '').trim();
        const matchedTimedOutCode = androidTimedOutCode !== null &&
          androidTimedOutCode === normalizedCode;

        androidTimedOutCode = null;

        try {
          androidHtml5QrCode.pause();
        } catch(e) {
          console.warn('暫停 Android 掃描器時發生錯誤:', e);
          isAndroidProcessing = false;
          return;
        }

        clearResultStyles();
        resultDiv.textContent = '驗證中...';
        statusDiv.textContent = '正在驗證...';

        processScannedCode(decodedText, matchedTimedOutCode);
      };

      try {
        await androidHtml5QrCode.start(
          { facingMode: "environment" },
          config,
          onScanSuccess,
          (errorMessage) => {
            console.debug('掃描錯誤:', errorMessage);
          }
        );

        clearResultStyles();
        resultDiv.textContent = '掃描QR-Code';
        statusDiv.textContent = '相機就緒，請慢慢對準';

        androidScanSessionReady = true;

      } catch (startError) {
        clearResultStyles();
        resultDiv.className = 'error';
        resultDiv.textContent = '無法啟動相機';
        statusDiv.textContent = '請關閉視窗後重新開啟 Scanner';

        androidHtml5QrCode = null;
        androidScanSessionReady = false;

        alert('相機啟動失敗，請關閉此視窗後重新開啟 Scanner。');
        console.error('Android 相機啟動失敗:', startError);
      }
    }

    // Android 解鎖或切回分頁後，檢查並嘗試恢復 video 播放
    document.addEventListener('visibilitychange', function() {
      if (document.visibilityState !== 'visible') {
        return;
      }

      setTimeout(async function() {
        if (!androidScanSessionReady || isAndroidProcessing) {
          return;
        }

        const video = document.querySelector('#android-reader video');
        const stream = video && video.srcObject;

        if (video && video.paused && stream) {
          const tracks = stream.getVideoTracks();

          const trackLive = tracks.some(function(track) {
            return track.readyState === 'live' && track.enabled;
          });

          if (trackLive) {
            try {
              await video.play();
              console.log('Android video 已嘗試恢復播放');
            } catch (error) {
              console.warn('Android video 恢復播放失敗:', error);
            }
          }
        }
      }, 1000);
    });

    function processScannedCode(codeText, matchedTimedOutCode) {
      clearResultStyles();

      const endMessage = checkScanEndStatus(codeText);

      if (endMessage) {
        resultDiv.className = 'error';
        resultDiv.textContent = endMessage;
        statusDiv.textContent = '處理完成，準備掃描下一個QR-Code';
        speakWithFallback(endMessage);

        resumeAndroidScanning();
        return;
      }

      resultDiv.textContent = '驗證中...';
      statusDiv.textContent = '正在驗證...';

      let requestFinished = false;

      const requestId = 'android-' + Date.now() + '-' +
        Math.random().toString(36).slice(2);

      const requestTimeout = setTimeout(() => {
        if (requestFinished) return;
        requestFinished = true;

        androidTimedOutCode = String(codeText || '').trim();

        resultDiv.className = 'error';
        resultDiv.textContent = '驗證逾時請重新掃描';
        statusDiv.textContent = '驗證逾時，準備重新掃描';
        speakWithFallback('驗證逾時請重新掃描');

        resumeAndroidScanning();
      }, 10000);

      fetch(API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },
        body: JSON.stringify({
          action: 'PROCESS_CHECKIN',
          password: staffPassword,
          token: API_TOKEN,
          code: String(codeText || '').trim(),
          requestId: requestId
        }),
        redirect: 'follow'
      })
      .then(response => {
        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }
        return response.json();
      })
      .then(data => {
        if (requestFinished) return;

        requestFinished = true;
        clearTimeout(requestTimeout);

        if (!data || data.status !== 'ok') {
          const errorMessage = data && data.msg
            ? String(data.msg)
            : '後端驗證失敗';

          if (errorMessage.indexOf('工作人員密碼錯誤') !== -1) {
            staffPassword = '';

            document.getElementById('staff-password').value = '';
            document.getElementById('staff-password-error').textContent =
              '工作人員密碼錯誤，請重新輸入';

            document.getElementById('staff-login').style.display = 'block';
            document.getElementById('android-reader').style.display = 'none';
            document.querySelector('.android-setup-line').style.display = 'block';
            document.getElementById('android-tip').style.display = 'block';

            resultDiv.className = 'error';
            resultDiv.textContent = '工作人員密碼錯誤';
            statusDiv.textContent = '請重新輸入工作人員密碼';

            speakWithFallback('工作人員密碼錯誤，請重新輸入');

            androidScanSessionReady = false;
            isAndroidProcessing = false;
            startBtn.style.display = 'inline-block';

            if (androidHtml5QrCode) {
              androidHtml5QrCode.stop().then(function() {
                androidHtml5QrCode.clear();
                androidHtml5QrCode = null;
              }).catch(function(error) {
                console.warn('停止 Android 掃描器時發生錯誤:', error);
                androidHtml5QrCode = null;
              });
            }

            return;
          }

          resultDiv.className = 'error';
          resultDiv.textContent = errorMessage;
          statusDiv.textContent = '伺服器處理失敗';
          speakWithFallback(errorMessage);
          resumeAndroidScanning();
          return;
        }

        handleServerResponse(
          data.result,
          codeText,
          matchedTimedOutCode
        );
      })
      .catch(error => {
        if (requestFinished) return;

        requestFinished = true;
        clearTimeout(requestTimeout);

        console.error('Android POST 通訊錯誤:', error);
        handleServerError(error);
      });
    }

    function resumeAndroidScanning() {
      setTimeout(() => {
        clearResultStyles();
        resultDiv.textContent = '掃描QR-Code';
        statusDiv.textContent = '相機就緒，請慢慢對準';

        try {
          androidHtml5QrCode.resume();

          setTimeout(() => {
            isAndroidProcessing = false;
          }, 800);

        } catch(e) {
          console.warn('恢復 Android 掃描器時發生錯誤:', e);
          statusDiv.textContent = '掃描恢復失敗，請重新啟動相機';
          startBtn.style.display = 'inline-block';
        }
      }, 1000);
    }

    function handleServerResponse(res, codeText, matchedTimedOutCode) {
      clearResultStyles();

      resultDiv.className = res.status || 'success';
      resultDiv.textContent = (res.info || '') + ' ' + (res.msg || '');
      statusDiv.textContent = '處理完成，準備掃描下一個QR-Code';

      const isVoteCode = /Q\d{2}[YN]$/i.test(String(codeText || '').trim());

      if (isVoteCode) {
        if (res && /重新掃描/.test(String(res.msg || ''))) {
          androidVoteCount = Math.max(0, androidVoteCount - 1);
        } else if (res && res.status === 'success') {
          androidVoteCount++;
        } else if (matchedTimedOutCode && res && res.status === 'repeat' &&
                   /已投票/.test(String(res.msg || ''))) {
          androidVoteCount++;
        }

        document.getElementById('android-vote-count').innerText = androidVoteCount;

      } else if (res && res.status === 'success') {
        androidCheckInCount++;
        document.getElementById('android-checkin-count').innerText = androidCheckInCount;

      } else if (matchedTimedOutCode && res && res.status === 'repeat' &&
                 /已完成報到/.test(String(res.msg || ''))) {
        androidCheckInCount++;
        document.getElementById('android-checkin-count').innerText = androidCheckInCount;
      }

      speakWithFallback(res.msg);
      resumeAndroidScanning();
    }

    function handleServerError(error) {
      clearResultStyles();

      resultDiv.className = 'error';
      resultDiv.textContent = '連線錯誤，請重試';
      statusDiv.textContent = '伺服器連接錯誤';

      speakWithFallback('錯誤');
      resumeAndroidScanning();
    }

    function speakWithFallback(text) {
      if (!text) return;

      if (!('speechSynthesis' in window)) {
        console.warn('瀏覽器不支援語音合成');
        return;
      }

      const synth = window.speechSynthesis;

      try {
        synth.cancel();

        if (synth.paused) {
          synth.resume();
        }

        let hasSpoken = false;

        function speakNow() {
          if (hasSpoken) return;
          hasSpoken = true;

          try {
            const voices = synth.getVoices();
            const msg = new SpeechSynthesisUtterance(String(text));

            msg.lang = 'zh-TW';
            msg.rate = 1.0;
            msg.volume = 1.0;
            msg.pitch = 1.0;

            const voice =
              voices.find(v => /^zh[-_]TW$/i.test(v.lang)) ||
              voices.find(v => /^zh[-_]HK$/i.test(v.lang)) ||
              voices.find(v => /^zh[-_]CN$/i.test(v.lang)) ||
              voices.find(v => /^zh/i.test(v.lang));

            if (voice) {
              msg.voice = voice;
              msg.lang = voice.lang;
              console.log('Android 選用語音:', voice.name, voice.lang);
            } else {
              console.warn('尚未找到中文語音，使用瀏覽器預設語音');
            }

            msg.onstart = function() {
              console.log('Android 語音開始播放:', text);
            };

            msg.onend = function() {
              console.log('Android 語音播放完成');
            };

            msg.onerror = function(event) {
              console.warn('Android 語音播放錯誤:', event.error);
            };

            synth.speak(msg);

          } catch (error) {
            console.warn('Android 語音初始化失敗:', error);
          }
        }

        const availableVoices = synth.getVoices();

        if (availableVoices.length > 0) {
          setTimeout(speakNow, 100);
        } else {
          let voicesChangedHandler;

          const voiceTimeout = setTimeout(function() {
            if (voicesChangedHandler) {
              synth.removeEventListener('voiceschanged', voicesChangedHandler);
            }
            setTimeout(speakNow, 100);
          }, 500);

          voicesChangedHandler = function() {
            if (synth.getVoices().length > 0) {
              clearTimeout(voiceTimeout);
              synth.removeEventListener('voiceschanged', voicesChangedHandler);
              setTimeout(speakNow, 100);
            }
          };

          synth.addEventListener('voiceschanged', voicesChangedHandler);
        }

      } catch (error) {
        console.warn('Android 語音播放處理失敗:', error);
      }
    }
  }

  // ========== 裝置版本選擇 ==========
  document.addEventListener('DOMContentLoaded', function() {
    if (window.isAndroid) {
      document.body.className = 'android';
      document.getElementById('android-container').style.display = 'block';
      document.getElementById('iphone-container').style.display = 'none';
      console.log('載入 Android 版本');
    } else {
      document.body.className = 'iphone';
      document.getElementById('iphone-container').style.display = 'block';
      document.getElementById('android-container').style.display = 'none';
      console.log('載入 iPhone 版本');
    }
  });

</script>
