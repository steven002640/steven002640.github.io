  <script>
    // ========== GitHub Pages 外部掃描頁通訊測試 ==========

    const SCANNER_URL = 'https://steven002640.github.io/scanner.html';
    const SCANNER_ORIGIN = 'https://steven002640.github.io';

    let scannerWindow = null;

    // 使用者點擊掃描按鈕時，開啟外部掃描頁
    document.getElementById('scannerLaunchBtn').addEventListener('click', function(event) {
      event.preventDefault();

      // 必須在使用者直接點擊時開啟，避免瀏覽器阻擋彈出視窗
      scannerWindow = window.open(SCANNER_URL, 'communityScanner');

      if (!scannerWindow) {
        alert('瀏覽器阻擋了新視窗，請允許此網站開啟彈出式視窗後再試一次。');
        return;
      }

      try {
        scannerWindow.focus();
      } catch (error) {
        // 部分瀏覽器可能不允許程式控制新視窗焦點
      }
    });

    // 接收 GitHub Pages 傳回的訊息
    window.addEventListener('message', function(event) {

      // 只接受指定 GitHub Pages 網域
      if (event.origin !== SCANNER_ORIGIN) {
        return;
      }

      // 只接受由本頁面實際開啟的掃描視窗傳來的訊息
      if (!scannerWindow || event.source !== scannerWindow) {
        return;
      }

      const data = event.data;

      // 驗證訊息格式
      if (
        !data ||
        typeof data !== 'object' ||
        data.channel !== 'COMMUNITY_SCANNER' ||
        data.action !== 'PING' ||
        typeof data.requestId !== 'string' ||
        data.requestId.length > 100
      ) {
        return;
      }

      // 回傳 PONG，不呼叫後端，也不寫入試算表
      event.source.postMessage({
        channel: 'COMMUNITY_SCANNER',
        action: 'PONG',
        requestId: data.requestId,
        message: 'GAS 已收到 PING'
      }, event.origin);

    });

  </script>
</body>
