
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>社區大會掃描通訊測試</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: #2c3e50;
      color: #ecf0f1;
      margin: 0;
      padding: 25px 15px;
      text-align: center;
    }

    h2 {
      margin-top: 25px;
      font-size: 1.4rem;
    }

    button {
      width: 90%;
      max-width: 320px;
      height: 52px;
      margin-top: 30px;
      border: none;
      border-radius: 7px;
      background: #3498db;
      color: white;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin: 30px auto 0;
      max-width: 500px;
      padding: 18px 12px;
      border-radius: 7px;
      background: #34495e;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h2>GAS 與外部掃描頁面通訊測試</h2>

  <p>請按下方按鈕，測試是否能與 GAS 主頁面互相傳送訊息。</p>

  <button id="testBtn">測試 GAS 通訊</button>

  <div id="status">尚未開始測試</div>

  <script>
    const GAS_CHANNEL = 'COMMUNITY_SCANNER';

    let currentRequestId = null;
    let responseReceived = false;

    const statusBox = document.getElementById('status');
    const testBtn = document.getElementById('testBtn');

    function showStatus(message) {
      statusBox.textContent = message;
    }

    window.addEventListener('message', function(event) {

      // 確認訊息確實來自開啟本頁面的 GAS 視窗
      if (!window.opener || event.source !== window.opener) {
        return;
      }

      const data = event.data;

      if (
        !data ||
        typeof data !== 'object' ||
        data.channel !== GAS_CHANNEL ||
        data.action !== 'PONG' ||
        typeof data.requestId !== 'string' ||
        data.requestId !== currentRequestId
      ) {
        return;
      }

      responseReceived = true;

      showStatus(
        '通訊成功！\n\n' +
        '已收到 GAS 主頁面的回覆：\n' +
        data.message
      );

      testBtn.disabled = false;
      testBtn.textContent = '再次測試 GAS 通訊';
    });

    testBtn.addEventListener('click', function() {

      if (!window.opener || window.opener.closed) {
        showStatus(
          '通訊失敗：\n\n' +
          '找不到開啟本頁面的 GAS 主視窗。\n' +
          '請回到 GAS 主頁面，重新點選「手機掃描作業」開啟本頁。'
        );
        return;
      }

      currentRequestId = 'REQ_' + Date.now();
      responseReceived = false;

      testBtn.disabled = true;

      showStatus('正在向 GAS 主頁面傳送測試訊息……');

      window.opener.postMessage({
        channel: GAS_CHANNEL,
        action: 'PING',
        requestId: currentRequestId
      }, '*');

      setTimeout(function() {

        if (!responseReceived) {
          showStatus(
            '尚未收到 GAS 回覆。\n\n' +
            '可能原因：\n' +
            '1. GAS 主頁面沒有正確接收訊息。\n' +
            '2. 瀏覽器沒有保留視窗之間的通訊關係。\n' +
            '3. GAS 主頁面部署版本尚未更新。'
          );

          testBtn.disabled = false;
          testBtn.textContent = '重新測試 GAS 通訊';
        }

      }, 5000);

    });
  </script>

</body>
</html>
