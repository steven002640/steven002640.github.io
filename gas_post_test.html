
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAS POST 通訊測試</title>

<style>
  body {
    font-family: "Microsoft JhengHei", sans-serif;
    background: #f3f5f8;
    margin: 0;
    padding: 20px;
    color: #263238;
  }

  .container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  h2 {
    margin-top: 0;
    color: #263b50;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }

  input {
    width: 100%;
    box-sizing: border-box;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccd3da;
    border-radius: 6px;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;
    border: none;
    border-radius: 7px;
    background: #2867a5;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }

  button:disabled {
    background: #9aa8b5;
    cursor: not-allowed;
  }

  #summary {
    margin-top: 18px;
    padding: 12px;
    background: #eef3f7;
    border-radius: 6px;
    line-height: 1.7;
  }

  #log {
    margin-top: 15px;
  }

  .item {
    border: 1px solid #dce2e8;
    border-radius: 7px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    line-height: 1.7;
    overflow-wrap: anywhere;
  }

  .success {
    border-left: 5px solid #269b65;
  }

  .error {
    border-left: 5px solid #d34c4c;
  }

  .pending {
    border-left: 5px solid #d49b35;
  }

  .detail {
    color: #52616e;
    white-space: pre-wrap;
  }

  .note {
    color: #687783;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 12px;
  }
</style>
</head>

<body>

<div class="container">

  <h2>GAS POST 直接通訊測試</h2>

  <label>GAS Web App URL</label>
  <input
    id="gasUrl"
    type="url"
    placeholder="https://script.google.com/macros/s/AKfycbybUTYyqhXgNB7Z_IugzEFIbhcBRey2mcE1a1tW2bsMCdo6630IP1r4qixdb1aSQUW3/exec"
  >

  <label>Token（若 GAS 有設定驗證才填寫）</label>
  <input
    id="token"
    type="text"
    placeholder="測試 Token"
  >

  <button id="startBtn" onclick="startTest()">
    開始測試 001～008
  </button>

  <div id="summary">
    等待開始測試
  </div>

  <div id="log"></div>

  <div class="note">
    測試方式：逐筆 POST，收到回覆後才送下一筆。<br>
    單筆等待上限：20 秒。<br>
    遇到錯誤或逾時立即停止，避免重複報到。
  </div>

</div>

<script>
const TEST_CODES = [
  '001', '002', '003', '004',
  '005', '006', '007', '008'
];

const REQUEST_TIMEOUT = 20000;

let testing = false;

function addLog(code, status, detail, elapsed, type) {

  const box = document.createElement('div');
  box.className = 'item ' + type;

  const title = document.createElement('strong');
  title.textContent = code + '：' + status;

  const content = document.createElement('div');
  content.className = 'detail';
  content.textContent =
    (elapsed !== null ? '耗時：' + elapsed + ' ms\n' : '') +
    detail;

  box.appendChild(title);
  box.appendChild(content);

  document.getElementById('log').appendChild(box);
}

function updateSummary(message) {
  document.getElementById('summary').textContent = message;
}

async function sendOne(url, token, code) {

  const requestId =
    'TEST_' + code + '_' + Date.now();

  const payload = {
    action: 'PROCESS_CHECKIN',
    code: code,
    token: token,
    requestId: requestId
  };

  const controller = new AbortController();

  const startedAt = performance.now();

  let timeoutId;

  try {

    const timeoutPromise = new Promise((resolve, reject) => {
      timeoutId = setTimeout(() => {
        controller.abort();
        reject(new Error('REQUEST_TIMEOUT'));
      }, REQUEST_TIMEOUT);
    });

    const fetchPromise = fetch(url, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      cache: 'no-store',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    });

    const response = await Promise.race([
      fetchPromise,
      timeoutPromise
    ]);

    const responseText = await response.text();

    const elapsed = Math.round(
      performance.now() - startedAt
    );

    let responseData;

    try {
      responseData = JSON.parse(responseText);
    } catch (e) {
      responseData = null;
    }

    const detail = [
      'HTTP Status: ' + response.status,
      'Response URL: ' + response.url,
      'Redirected: ' + response.redirected,
      'Request ID: ' + requestId,
      '原始回覆：',
      responseText
    ].join('\n');

    if (!response.ok) {
      throw new Error(
        'HTTP_' + response.status + '\n' + detail
      );
    }

    if (responseData === null) {
      throw new Error(
        '回覆不是有效 JSON\n' + detail
      );
    }

    return {
      success: true,
      elapsed: elapsed,
      detail: detail,
      data: responseData
    };

  } catch (error) {

    const elapsed = Math.round(
      performance.now() - startedAt
    );

    return {
      success: false,
      elapsed: elapsed,
      detail:
        '錯誤：' + error.message +
        '\nRequest ID: ' + requestId +
        '\n請求可能已抵達 GAS，但前端未必收到回覆。'
    };

  } finally {
    clearTimeout(timeoutId);
  }
}

async function startTest() {

  if (testing) return;

  const url = document.getElementById('gasUrl')
    .value.trim();

  const token = document.getElementById('token')
    .value.trim();

  if (!url) {
    alert('請先填入 GAS Web App URL');
    return;
  }

  if (!/\/exec(?:\?|$)/.test(url)) {
    alert('請確認使用 GAS 部署後的 /exec 網址');
    return;
  }

  testing = true;

  const button = document.getElementById('startBtn');
  button.disabled = true;

  document.getElementById('log').innerHTML = '';

  let successCount = 0;
  let failCount = 0;

  updateSummary('開始測試，共 8 筆');

  try {

    for (let i = 0; i < TEST_CODES.length; i++) {

      const code = TEST_CODES[i];

      updateSummary(
        '正在送出 ' + code +
        '（' + (i + 1) + '/8）'
      );

      addLog(
        code,
        '正在送出...',
        'POST → GAS doPost',
        null,
        'pending'
      );

      const result = await sendOne(url, token, code);

      const log = document.getElementById('log');
      const lastItem = log.lastElementChild;

      if (result.success) {

        successCount++;

        lastItem.className = 'item success';
        lastItem.innerHTML = '';

        const title = document.createElement('strong');
        title.textContent = code + '：收到 GAS 回覆';

        const detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent =
          '耗時：' + result.elapsed + ' ms\n' +
          result.detail;

        lastItem.appendChild(title);
        lastItem.appendChild(detail);

      } else {

        failCount++;

        lastItem.className = 'item error';
        lastItem.innerHTML = '';

        const title = document.createElement('strong');
        title.textContent = code + '：通訊失敗';

        const detail = document.createElement('div');
        detail.className = 'detail';
        detail.textContent =
          '耗時：' + result.elapsed + ' ms\n' +
          result.detail;

        lastItem.appendChild(title);
        lastItem.appendChild(detail);

        updateSummary(
          '測試中止：' + code + ' 發生錯誤\n' +
          '成功收到回覆：' + successCount + ' 筆\n' +
          '失敗：' + failCount + ' 筆\n' +
          '後續資料未送出'
        );

        return;
      }

      updateSummary(
        '測試進行中\n' +
        '已成功收到回覆：' + successCount + ' / 8'
      );
    }

    updateSummary(
      '測試完成\n' +
      '成功收到回覆：' + successCount + ' / 8\n' +
      '失敗：' + failCount + ' / 8'
    );

  } finally {

    testing = false;
    button.disabled = false;
  }
}
</script>

</body>
</html>
